  <style>
    /* Remove margins, padding, and scrollbars for full-screen feel */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #f0f0f0; /* Matches your Apps Script background */
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
